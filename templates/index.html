<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Disaster Risk Detection</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        .risk {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .recommendation {
            background: #f1f5f9;
            padding: 15px;
            margin: 8px 0;
            border-radius: 8px;
        }

        @media(max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

<div class="header">

    <h1>🌍 AI Natural Disaster Risk Detector</h1>

    <p>Machine Learning Based Risk Analysis & Safety Recommendations</p>

</div>


<div class="container">

    <div class="card">

        <h2>Enter Environmental Data</h2>

        <form id="riskForm">

            <div class="grid">

                <div>
                    <label>Rainfall (mm)</label>
                    <input
                        type="number"
                        name="rainfall"
                        step="0.1"
                        required>
                </div>

                <div>
                    <label>Temperature (°C)</label>
                    <input
                        type="number"
                        name="temperature"
                        step="0.1"
                        required>
                </div>

                <div>
                    <label>Wind Speed (km/h)</label>
                    <input
                        type="number"
                        name="wind_speed"
                        step="0.1"
                        required>
                </div>

                <div>
                    <label>Water Level (m)</label>
                    <input
                        type="number"
                        name="water_level"
                        step="0.1"
                        required>
                </div>

                <div>
                    <label>Earthquake Magnitude</label>
                    <input
                        type="number"
                        name="earthquake"
                        min="0"
                        max="10"
                        step="0.1"
                        required>
                </div>

                <div>
                    <label>Slope (degrees)</label>
                    <input
                        type="number"
                        name="slope"
                        min="0"
                        max="90"
                        step="0.1"
                        required>
                </div>

            </div>

            <button type="submit">
                🔍 Detect Disaster Risk
            </button>

        </form>


        <div id="result">

            <hr>

            <h2>AI Analysis</h2>

            <div id="risk" class="risk"></div>

            <p>
                AI Confidence:
                <strong id="probability"></strong>
            </p>

            <h3>Safety Recommendations</h3>

            <div id="recommendations"></div>

        </div>

    </div>

</div>


<script>

document
.getElementById("riskForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData(this);

    const response = await fetch(
        "/predict",
        {
            method: "POST",
            body: formData
        }
    );

    const data = await response.json();

    const result = document.getElementById("result");

    result.style.display = "block";

    if (data.error) {

        document.getElementById("risk").innerText =
            "Error: " + data.error;

        return;

    }

    document.getElementById("risk").innerText =
        "🚨 " + data.risk +
        " — " + data.risk_level + " RISK";

    document.getElementById("probability").innerText =
        data.probability + "%";

    const recommendations =
        document.getElementById("recommendations");

    recommendations.innerHTML = "";

    data.recommendations.forEach(function(item) {

        const div = document.createElement("div");

        div.className = "recommendation";

        div.innerText = "✅ " + item;

        recommendations.appendChild(div);

    });

});

</script>

</body>

</html>
